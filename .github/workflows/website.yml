name: Deploy website from main

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/**"
      - "public/**"
      - "vite*.config.ts"
      - "tsconfig*.json"
      - "components.json"
      - "init.cjs"
      - "package.json"
      - "bun.lock"
      - "wrangler.jsonc"
      - "scripts/generate-og-image.mjs"
      - "scripts/deploy-website.mjs"
      - "scripts/sync-website-download.mjs"
      - "scripts/release-contract.mjs"
      - ".github/workflows/website.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Serialize every route. Queued runs recheck current main and /releases/latest
# before deployment, so neither stale source nor a stale installer can publish.
concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  resolve:
    if: ${{ github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft) }}
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.release.outputs.eligible }}
      id: ${{ steps.release.outputs.id }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - name: Resolve immutable current main and latest published stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          main=$(gh api repos/akbarsaputrait/sela/git/ref/heads/main --jq '.object.sha')
          [[ "$main" =~ ^[a-f0-9]{40}$ ]]
          source_sha="$main"
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$PUSH_SHA" != "$main" ]]; then
              echo "Ignoring a stale push that is no longer current main."
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            source_sha="$PUSH_SHA"
          fi
          latest=$(gh api repos/akbarsaputrait/sela/releases/latest)
          id=$(jq -er '.id | select(type == "number" and . > 0)' <<< "$latest")
          tag=$(jq -er '.tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<< "$latest")
          jq -e '.draft == false and .prerelease == false' <<< "$latest" >/dev/null
          if [[ -n "$EVENT_RELEASE_ID" && "$EVENT_RELEASE_ID" != "$id" ]]; then
            echo "Ignoring a published release that is not the latest stable release."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Resolved main $source_sha with latest published release $tag ($id)."
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
  deploy:
    needs: resolve
    if: ${{ needs.resolve.outputs.eligible == 'true' }}
    runs-on: ubuntu-latest
    environment: website
    steps:
      - name: Require scoped Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required website environment secret/configuration: $name" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - name: Reject stale main before installing dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          SELA_WEBSITE_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          main=$(gh api repos/akbarsaputrait/sela/git/ref/heads/main --jq '.object.sha')
          [[ "$(git rev-parse HEAD)" == "$SELA_WEBSITE_SOURCE_SHA" && "$main" == "$SELA_WEBSITE_SOURCE_SHA" ]]
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Build, verify exact release asset, deploy and verify served bytes
        env:
          GH_TOKEN: ${{ github.token }}
          SELA_RELEASE_ID: ${{ needs.resolve.outputs.id }}
          SELA_WEBSITE_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:website
